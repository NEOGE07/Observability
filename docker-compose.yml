services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - observability

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.4
    container_name: kibana
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    depends_on:
      - elasticsearch
    command:
      - "--config=/etc/otelcol-contrib/otel-collector.yml"
    volumes:
      - ./otel/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml
      - ./collector-output:/collector-output
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    networks:
      - observability

  otel-agent:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-agent
    command: ["--config=/etc/otelcol-contrib/otel-agent-collector.yml"]
    volumes:
      - ./otel/otel-agent-collector.yml:/etc/otelcol-contrib/otel-agent-collector.yml:ro
      - ./collector-output:/collector-output

    depends_on:
      - otel-collector
    networks:
      - observability


  test-app:
    build:
      context: ./app
    container_name: test-app
    depends_on:
      - otel-agent
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-agent:4318
      - OTEL_SERVICE_NAME=test-app
    ports:
      - "8080:8080"
    networks:
      - observability

volumes:  
  elasticsearch-data:

networks:
  observability:
    driver: bridge
