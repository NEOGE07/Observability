
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform/add-attribute:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["test.processed"], true)
          - set(attributes["test.environment"], "lab")
          - set(attributes["test.source"], "otel-agent")
  batch:

exporters:
  otlp/backend:
    endpoint: otel-collector:4317
    tls:
      insecure: true

  debug/before:
    verbosity: detailed
  debug/after:
    verbosity: detailed

  
  file/before:
    path: /collector-output/traces-before.json
  file/after:
    path: /collector-output/traces-after.json


service:
  pipelines:
    # BEFORE transformation
    traces/before_transform:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug/before, file/before]

    # AFTER transformation
    traces/after_transform:
      receivers: [otlp]
      processors: [transform/add-attribute, batch]
      exporters: [debug/after, file/after, otlp/backend]

    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug/after, otlp/backend]

    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug/after, otlp/backend]

