
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  transform/add-attribute:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - set(attributes["test.processed"], true)
          - set(attributes["test.environment"], "production")
          - set(attributes["test.source"], "otel-collector")

  batch:

exporters:
  elasticsearch:
    endpoints:
      - http://elasticsearch:9200
    metrics_index: metrics-generic.otel-default

  debug/before:
    verbosity: detailed

  debug/after:
    verbosity: detailed

  debug/metrics:
    verbosity: detailed

  file/before:
    path: /collector-output/traces-before.json
    format: json

  file/after:
    path: /collector-output/traces-after.json
    format: json

service:
  pipelines:
    # BEFORE transformation
    traces/before_transform:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug/before, file/before]

    # AFTER transformation
    traces/after_transform:
      receivers: [otlp]
      processors: [transform/add-attribute, batch]
      exporters: [debug/after, file/after, elasticsearch]

    # Receive converted metrics from otel-agent
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug/metrics, elasticsearch]

    # Receive logs
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [elasticsearch]

